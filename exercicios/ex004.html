<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(71, 23, 116);
        }
        
    </style>
</head>
<body>
    <h1>Olá, mundo</h1>    
</body>
<script>
    var nome = window.prompt('Qual seu nome')
    document.writeln(`Olá, ${nome}! Seu nome tem ${nome.length} letras <br/>`)
    document.writeln(`Seu nome em maiusculas fica ${nome.toUpperCase()} <br/>`)
    document.writeln(`Seu nome em letras minusculas fica ${nome.toLowerCase()}`)

</script>
</html>
