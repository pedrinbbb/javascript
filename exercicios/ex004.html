<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body{
            background-color: rgb(255, 255, 255);
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }
        
    </style>
</head>
<body> 
</body>
<script>
    var nome = window.prompt('seu nome?')
    document.writeln(`ola, ${nome} seu nome tem ${nome.length} letras <br/>`)
    document.writeln(`seu nome em maisculas fica ${nome.toUpperCase()} <br/>`)
    document.writeln(`seu nome em minusculas fica ${nome.toLowerCase()}`)
</script>
</html>
