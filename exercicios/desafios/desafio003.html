<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio naturalidade</title>
</head>
<body>
    <h1>desafio naturalidade</h1>
    <input type="text" id="txtp">
    <input type="button" value="verificar" onclick="verificar()">
    <div id="res">
        resultado
    </div>

    <script>
        var txtp = String(window.document.getElementById('txtp'))
        var res = window.document.getElementById('res')
        function verificar(){
            if (txtp != 'brasil'){
                res.innerHTML = `voce é estrangeiro`
            }else{
                res.innerHTML = `voce é brasileiro`
            }
        }
    </script>
    
</body>
</html>
