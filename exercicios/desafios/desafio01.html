<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sistema d multas</h1>
    Velocidade do carro: <input type="text" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">
        <p>Resultado:</p>
    </div>

    <script>
       function calcular() {
        var txtv = window.document.getElementById('txtvel')
        var res = window.document.getElementById('res')
        var vel = Number(txtv.value)
        res.innerHTML = `<p> sua velocidade atual é de ${vel}Km/h</p>`
        if (vel > 60){
            res.innerHTML = `<p>sua velocidade atual é de ${vel} e voce ultrapassou a velocidade permitida<p/>`
        }
        res.innerHTML += '<p>dirija sempre com cuidado</p>'
    }
    </script>
</body>
</html>
