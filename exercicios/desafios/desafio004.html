<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;color: white;
            background-color: rgb(104, 158, 206);
            font: bold 1.3em arial;
            text-shadow: 1px 2px 10px rgba(0, 0, 0, 0.493);
        }
        section{
            background-color: white;
            border-radius: 10px;
            width: 500px;
            margin: auto;
            padding: 15px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.473);
        }
        div{
            text-align: center;
            color: black;
            padding: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Horario do dia</h1>
    </header>
    <section>
        <div id="msg">
            teste
        </div>
        <div id="foto">
            <img id="imagem" src="desafio005/img/fotomanha2.png" alt="" height="300px">
        </div>
    </section>
    <footer>
        <p>&copy; Pedro lucas</p>
    </footer>


    <script>
        var msg = document.getElementById('msg')
        var img = document.getElementById('imagem')
        var data = new Date()
        var hora = data.getHours()
        msg.innerHTML = `Agora sao ${hora} horas`
        if (hora >= 5 && hora < 12){
            img.src = 'desafio005/img/fotomanha2.png'
            msg.innerText = `Bom dia, agora sao ${hora} horas`
        }else if(hora >= 13 && hora < 19){
            img.src = 'desafio005/img/fototarde2.png'
            msg.innerText = `Boa tarde, agora sao ${hora} horas`
        }else{
            img.src = 'desafio005/img/fotonoite2.png'
            msg.innerText = `Boa noite, agora sao ${hora} horas`
        }
    </script>
</body>
</html>
