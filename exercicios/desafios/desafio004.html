<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
   <h1>dia da semana</h1>
   <input type="text" id="dia">
   <input type="button" value="verificar" onclick="diasemana()">
   <div id="res"></div>


    </div>
    <script>
        function diasemana(){
            var dia = Number(document.getElementById('dia').value)
            var res = document.getElementById('res')
            
            switch (dia){
        case 0:
            res.innerHTML = ('Domingo')
            break
        case 1:
            res.innerHTML = 'Segunda'
            break
        case 2:
            res.innerHTML = 'Terça'
            break
        case 3:
            res.innerHTML = 'Quarta'
            break
        case 4:
            res.innerHTML = 'Quinta'
            break
        case 5:
            res.innerHTML = 'Sexta'
            break
        case 6:
            res.innerHTML = 'Sábado'
            break
        default:
            res.innerHTML = 'ERRO! Dia inválido'
    }
        }
    </script>

</body>
</html>
